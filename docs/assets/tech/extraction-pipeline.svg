<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1512 500" width="1512" height="500" role="img" aria-label="Gmail messages and WhatsApp receipt photos pass identity checks, structured extraction and deterministic guards in the Cloudflare agent, then cross into the Next.js backend through idempotent writes. Only a complete, owned Gmail import whose extraction and category scores are both at least 0.5 is confirmed on import; all other items wait in the Review Queue until the User confirms them.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f9e66"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"/>
    </marker>
  </defs>

  <g font-family="'Nunito Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
    <rect width="1512" height="500" rx="16" fill="#ffffff"/>

    <!-- Runtime regions -->
    <rect x="16" y="44" width="969" height="440" rx="12" fill="#f5f7fa"/>
    <rect x="1005" y="44" width="491" height="440" rx="12" fill="#f6f3fc"/>
    <text x="32" y="30" font-size="14" font-weight="700">Cloudflare agent</text>
    <text x="1021" y="30" font-size="14" font-weight="700">Next.js backend</text>
    <text x="1144" y="30" font-size="13" fill="#64748b">owns every financial write</text>
    <line x1="995" y1="44" x2="995" y2="484" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

    <!-- Column headers -->
    <g font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.6">
      <text x="116" y="76">SOURCE</text>
      <text x="354" y="76">IDENTITY</text>
      <text x="610" y="76">READ</text>
      <text x="860" y="76">GUARD</text>
      <text x="1128" y="76">WRITE ONCE</text>
      <text x="1390" y="76">OUTCOME</text>
    </g>

    <!-- Sources -->
    <g fill="#ffffff" stroke="#4263eb" stroke-width="1.5">
      <rect x="32" y="100" width="168" height="80" rx="10"/>
      <rect x="32" y="260" width="168" height="80" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="116" y="134" font-size="14" font-weight="700">Gmail message</text>
      <text x="116" y="154" font-size="11.5" fill="#64748b">the User's listed</text>
      <text x="116" y="169" font-size="11.5" fill="#64748b">bank senders only</text>
      <text x="116" y="294" font-size="14" font-weight="700">Receipt photo</text>
      <text x="116" y="314" font-size="11.5" fill="#64748b">plus caption, if any</text>
    </g>

    <!-- Identity -->
    <g fill="#ffffff" stroke="#2f9e66" stroke-width="1.5">
      <rect x="260" y="100" width="188" height="80" rx="10"/>
      <rect x="260" y="240" width="188" height="120" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="354" y="128" font-size="14" font-weight="700">Composio connection</text>
      <text x="354" y="148" font-size="11.5" fill="#64748b">sender auth recorded</text>
      <text x="354" y="164" font-size="11.5" fill="#64748b">message claimed once</text>
      <text x="354" y="272" font-size="14" font-weight="700">Verified WhatsApp link</text>
      <text x="354" y="296" font-size="11.5" fill="#64748b">queued in the User's own</text>
      <text x="354" y="312" font-size="11.5" fill="#64748b">Durable Object</text>
      <text x="354" y="334" font-size="11.5" fill="#64748b">photo held in memory, never stored</text>
    </g>

    <!-- Read -->
    <rect x="520" y="100" width="180" height="260" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="610" y="176" font-size="14" font-weight="700">Structured extraction</text>
      <text x="610" y="202" font-size="11.5" fill="#64748b">model reads text</text>
      <text x="610" y="218" font-size="11.5" fill="#64748b">or image</text>
      <text x="610" y="242" font-size="11.5" fill="#64748b">content is data,</text>
      <text x="610" y="258" font-size="11.5" fill="#64748b">never instructions</text>
      <text x="610" y="282" font-size="11.5" fill="#64748b">strict JSON schema,</text>
      <text x="610" y="298" font-size="11.5" fill="#64748b">no tools</text>
    </g>

    <!-- Guard -->
    <rect x="760" y="100" width="200" height="260" rx="10" fill="#fff8ef" stroke="#d9822b" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="860" y="132" font-size="14" font-weight="700">Deterministic guards</text>
      <text x="860" y="158" font-size="11.5" fill="#64748b">IDR amounts only</text>
      <text x="860" y="182" font-size="11.5" fill="#64748b">date at most 1 day ahead,</text>
      <text x="860" y="198" font-size="11.5" fill="#64748b">at most 400 days old</text>
      <text x="860" y="222" font-size="11.5" fill="#64748b">Gmail: amount and location</text>
      <text x="860" y="238" font-size="11.5" fill="#64748b">must appear in the email</text>
      <text x="860" y="262" font-size="11.5" fill="#64748b">account set only on exactly</text>
      <text x="860" y="278" font-size="11.5" fill="#64748b">one owned match</text>
      <text x="860" y="302" font-size="11.5" fill="#64748b">a guarded field caps</text>
      <text x="860" y="318" font-size="11.5" fill="#64748b">confidence at 0.5</text>
    </g>

    <!-- Nothing saved -->
    <rect x="760" y="408" width="200" height="56" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="860" y="432" text-anchor="middle" font-size="14" font-weight="700">Nothing saved</text>
    <text x="860" y="450" text-anchor="middle" font-size="11.5" fill="#64748b">reply asks User to type it</text>

    <!-- Write once -->
    <g fill="#ffffff" stroke="#7950f2" stroke-width="1.5">
      <rect x="1030" y="100" width="196" height="80" rx="10"/>
      <rect x="1030" y="260" width="196" height="80" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="1128" y="128" font-size="14" font-weight="700">Gmail import</text>
      <text x="1128" y="148" font-size="11.5" fill="#64748b">key: message + item index</text>
      <text x="1128" y="164" font-size="11.5" fill="#64748b">then a typed Category</text>
      <text x="1128" y="288" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">add_receipt_transaction</text>
      <text x="1128" y="308" font-size="11.5" fill="#64748b">key: wa:&lt;message id&gt;</text>
      <text x="1128" y="324" font-size="11.5" fill="#64748b">source set by the server</text>
    </g>

    <!-- Outcomes -->
    <rect x="1300" y="100" width="180" height="80" rx="10" fill="#e9f7ef" stroke="#2f9e66" stroke-width="2"/>
    <text x="1390" y="134" text-anchor="middle" font-size="14" font-weight="700">Confirmed</text>
    <text x="1390" y="154" text-anchor="middle" font-size="11.5" fill="#64748b">counts in totals</text>
    <rect x="1300" y="240" width="180" height="120" rx="10" fill="#fff8ef" stroke="#d9822b" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="1390" y="278" font-size="14" font-weight="700">Review Queue</text>
      <text x="1390" y="302" font-size="11.5" fill="#64748b">pending, not in totals</text>
      <text x="1390" y="326" font-size="11.5" fill="#64748b">User confirms,</text>
      <text x="1390" y="342" font-size="11.5" fill="#64748b">edits or rejects</text>
    </g>

    <!-- Arrows -->
    <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="200" y1="140" x2="257" y2="140"/>
      <line x1="200" y1="300" x2="257" y2="300"/>
      <line x1="448" y1="140" x2="517" y2="140"/>
      <line x1="448" y1="300" x2="517" y2="300"/>
      <line x1="700" y1="140" x2="757" y2="140"/>
      <line x1="700" y1="300" x2="757" y2="300"/>
      <line x1="960" y1="140" x2="1027" y2="140"/>
      <line x1="960" y1="300" x2="1027" y2="300"/>
      <line x1="1226" y1="164" x2="1297" y2="256"/>
      <line x1="1226" y1="300" x2="1297" y2="300"/>
    </g>
    <line x1="1226" y1="140" x2="1297" y2="140" stroke="#2f9e66" stroke-width="2" marker-end="url(#arrow-green)"/>
    <line x1="1390" y1="240" x2="1390" y2="183" stroke="#2f9e66" stroke-width="2" marker-end="url(#arrow-green)"/>
    <line x1="860" y1="360" x2="860" y2="405" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Arrow labels -->
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="229" y="133">API</text>
      <text x="229" y="293">webhook</text>
      <text x="484" y="133">bounded text</text>
      <text x="484" y="293">image</text>
      <text x="730" y="133">fields</text>
      <text x="730" y="293">fields</text>
      <text x="1012" y="133">save</text>
      <text x="1012" y="293">save</text>
      <text x="1263" y="281">always</text>
      <text x="1263" y="293">pending</text>
    </g>
    <text x="1263" y="133" font-size="11" fill="#2f9e66" font-weight="700" text-anchor="middle">all gates</text>
    <text x="1236" y="222" font-size="11" fill="#475569" text-anchor="middle">otherwise</text>
    <text x="1398" y="216" font-size="11" fill="#2f9e66" font-weight="700">User confirms</text>
    <text x="850" y="382" font-size="11" fill="#c92a2a" text-anchor="end">no clear amount,</text>
    <text x="850" y="396" font-size="11" fill="#c92a2a" text-anchor="end">or not a transaction</text>
  </g>
</svg>
