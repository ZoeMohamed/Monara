<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Monara product screenshots</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    #w { width: 1500px; height: 960px; background: radial-gradient(ellipse at 50% 30%, #e1eeff, #f4faff 70%); border-radius: 32px; padding: 48px 56px; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; }
    .top p { margin: 0; font-size: 20px; color: var(--muted); }
    .screens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
    figure { margin: 0; }
    figcaption { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px 8px; font-weight: 800; font-size: 26px; }
    figcaption span { font-size: 17px; color: #2865e5; }
    .phone { padding: 7px; background: #fff; border: 1px solid #d0e0f2; border-radius: 33px; box-shadow: 0 18px 30px #284f8520; }
    .phone img { display: block; width: 100%; border-radius: 26px; }
    .note { margin: 28px 8px 0; font-size: 19px; color: var(--muted); }
  </style>
</head>
<body><main id="w">
  <div class="top"><span class="eyebrow">Inside Monara</span><p>Real product screens · Synthetic demo data</p></div>
  <div class="screens">
    <figure><figcaption><span>01</span> Overview</figcaption><div class="phone"><img src="../screenshots/overview.png" alt="Overview with confirmed spending and weekly guide"></div></figure>
    <figure><figcaption><span>02</span> Review</figcaption><div class="phone"><img src="../screenshots/review.png" alt="Pending transactions in the review queue"></div></figure>
    <figure><figcaption><span>03</span> Budgets</figcaption><div class="phone"><img src="../screenshots/budgets.png" alt="Monthly budget progress and daily spending guide"></div></figure>
    <figure><figcaption><span>04</span> Ask Monara</figcaption><div class="phone"><img src="../screenshots/chat.png" alt="Demo chat summarizing confirmed spending"></div></figure>
  </div>
  <p class="note">Explore the demo without signing in. Changes reset on reload; chat uses sample responses.</p>
</main></body>
</html>
