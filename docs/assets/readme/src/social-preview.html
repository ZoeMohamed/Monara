<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Monara GitHub social preview</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    #w { width: 1280px; height: 640px; background: #edf7ff; }
    .halo { position: absolute; width: 820px; height: 820px; left: 650px; top: -90px; border-radius: 50%; background: #d8eaff; }
    .copy { position: absolute; left: 65px; top: 105px; width: 650px; }
    .logo { width: 330px; height: auto; }
    h1 { margin: 36px 0 18px; font-size: 58px; font-weight: 900; line-height: 1.08; letter-spacing: -1.8px; }
    p { margin: 0; max-width: 560px; font-size: 25px; line-height: 1.5; color: #405b83; }
    .url { margin-top: 38px; font-size: 20px; font-weight: 750; color: #2865e5; }
    .phone { position: absolute; left: 860px; top: 62px; width: 272px; padding: 7px; background: white; border: 1px solid #c8dbee; border-radius: 35px; box-shadow: 0 24px 40px #193e7726; transform: rotate(7deg); }
    .phone img { display: block; width: 100%; border-radius: 28px; }
  </style>
</head>
<body><main id="w">
  <div class="halo"></div>
  <div class="copy"><img class="logo" src="../../../../apps/web/public/logos/monara-lockup-light.svg" alt="Monara"><h1>No more<br>scattered spending.</h1><p>An AI personal-finance assistant for tracking spending, reviewing transactions, and managing budgets.</p><div class="url">monara-finance.vercel.app</div></div>
  <div class="phone"><img src="../screenshots/overview.png" alt="Monara overview with synthetic demo data"></div>
</main></body>
</html>
