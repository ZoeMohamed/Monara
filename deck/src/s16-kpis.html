<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="base.css">
<style>html,body{width:940px;height:200px}
.row{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.t{position:relative;border-radius:20px;background:#fff;border:2px solid var(--card-border);padding:16px 18px;box-shadow:0 2px 10px rgba(40,50,80,.08)}
.t.hot{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.k{font-size:16px;font-weight:700;color:var(--navy);line-height:1.25;min-height:24px}.hot .k{color:var(--pale)}
.ic{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:11px;background:var(--pale);display:flex;align-items:center;justify-content:center}
.hot .ic{background:rgba(255,255,255,.2)}.ic svg{width:21px;height:21px}
.n{font-size:36px;font-weight:800;color:var(--navy);margin-top:18px;line-height:1.1}.hot .n{color:#fff}
.r{font-size:16px;font-weight:700;color:var(--brand-dark);margin-top:8px}.hot .r{color:var(--pale)}
.s{font-size:14px;font-weight:600;color:var(--navy);margin-top:6px;line-height:1.3}.hot .s{color:var(--pale)}
</style></head><body><div class="row">
<div class="t"><div class="k">Monthly revenue</div><div class="n">US$400</div><div class="r">≈ RMB 2,693</div><div class="s">250 Premium users</div></div>
<div class="t"><div class="k">Annualized revenue</div><div class="n">US$4,800</div><div class="r">≈ RMB 32,310</div><div class="s">12 x US$400 monthly</div></div>
<div class="t"><div class="k">Monthly surplus</div><div class="n">US$250</div><div class="r">≈ RMB 1,683</div><div class="s">Revenue minus the US$150 budget</div></div>
<div class="t hot"><div class="k">Break-even</div><div class="n">94</div><div class="r">Premium users</div><div class="s">US$150 ÷ US$1.60 a month</div></div>
</div></body></html>
