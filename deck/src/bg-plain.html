<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;font-family:Poppins,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(135deg,#1b44b0 0%,#2a62ee 55%,#3171FD 100%)}
.c{position:absolute;border-radius:50%;background:#fff;opacity:.07}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2px);background-size:46px 46px;opacity:.7}
.mark{position:absolute;right:-120px;bottom:-140px;width:760px;opacity:.10}
.tag{position:absolute;left:110px;bottom:70px;color:#fff;font-size:28px;font-weight:600;letter-spacing:.2px}
.tag b{font-weight:700}.tag span{opacity:.85;font-weight:500}
</style></head><body><div class="bg"></div><div class="dots"></div>
<div class="c" style="width:900px;height:900px;left:-300px;top:-420px"></div><div class="c" style="width:620px;height:620px;right:180px;top:-260px"></div>
<img class="mark" src="../brand/logo-dark.svg">

</body></html>
