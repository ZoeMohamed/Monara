<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:768px;height:507px;background:transparent;font-family:'Poppins',sans-serif;color:#1b1b1b}
.t{position:absolute;inset:0;display:grid;grid-template-columns:118px 246px 214px 190px;grid-template-rows:58px repeat(4,1fr);background:#fff;border-radius:16px;overflow:hidden;border:2px solid #c9d9ff;box-shadow:0 2px 12px rgba(40,50,80,.08)}
.c{display:flex;align-items:center;padding:0 16px;font-size:19px;line-height:1.25;border-bottom:2px solid #e6ecfa;border-right:2px solid #e6ecfa;font-weight:500}
.c:nth-child(4n){border-right:none}
.h{background:#3171FD;color:#fff;font-weight:700;font-size:20px;border-bottom:none;border-right:2px solid #5b8fff;justify-content:center;text-align:center}
.l{font-weight:700;background:#eef3ff;color:#14307f;justify-content:center;text-align:center;flex-direction:column;gap:2px}
.l small{font-size:14px;font-weight:600;color:#3171FD}
.v{font-weight:700;color:#14307f;font-size:24px}
.v small{font-size:15px;font-weight:600;color:#4d5160;margin-left:6px}
.r4 .c{border-bottom:none}
</style></head><body>
<div class="t">
<div class="c h">Wave</div><div class="c h">Markets</div><div class="c h">Channel</div><div class="c h">SAM reached</div>
<div class="c l">1<small>Beachhead</small></div><div class="c">Indonesia</div><div class="c">WhatsApp, in-app chat</div><div class="c v">86M</div>
<div class="c l">2</div><div class="c">Malaysia, Singapore</div><div class="c">WhatsApp</div><div class="c v">104M</div>
<div class="c l">3</div><div class="c">Philippines, Thailand</div><div class="c">Messenger, LINE</div><div class="c v">166M</div>
<div class="c l" style="border-bottom:none">4</div><div class="c" style="border-bottom:none">Vietnam</div><div class="c" style="border-bottom:none">Zalo</div><div class="c v" style="border-bottom:none">198M</div>
</div></body></html>
