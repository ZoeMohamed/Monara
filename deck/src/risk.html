<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1728px;height:724px;overflow:hidden;background:transparent;font-family:Poppins,sans-serif;color:#1b1b1b}
h1{font-size:54px;font-weight:700;color:#191919;letter-spacing:-1px;height:80px}
h1 span{color:#3171FD}
.row{position:absolute;left:0;width:1728px;height:104px;background:#fff;border:3px solid #dce7ff;border-radius:22px;box-shadow:0 4px 14px rgba(40,50,80,.08);display:flex;align-items:center}
.hd{background:#3171FD;border-color:#3171FD;height:60px;color:#fff;font-weight:700;font-size:20px;letter-spacing:3px}
.c1{width:560px;padding:0 30px;font-size:25px;font-weight:700;color:#14307f;line-height:1.25}
.c2{width:900px;padding:0 20px;font-size:23px;color:#3b4254;line-height:1.35}
.c3{width:268px;text-align:center}
.pill{display:inline-block;background:#eef3ff;color:#1f4fc4;border:2px solid #c9d9ff;border-radius:18px;padding:5px 18px;font-size:18px;font-weight:700}
.hd .c1,.hd .c2{color:#fff;font-size:20px;font-weight:700}
</style></head><body><div id="w" style="position:absolute;left:0;top:-96px;width:1728px;height:820px">
<div class="row hd" style="top:96px"><div class="c1">RISK</div><div class="c2">HOW THE DESIGN HANDLES IT</div><div class="c3">STATUS</div></div>
<script>
const rows=[
["Gmail access and consent","Monara asks for the minimum read-only Gmail scope and explains it before the Google screen. Users can disconnect Gmail at any time."],
["Deleting and disconnecting data","Disconnecting Gmail or deleting imported items never removes the rest of a user's data. Every item keeps its source."],
["Privacy law in each market","Designed for consent, minimal data and clear purpose. Each launch market gets its own privacy-law review before launch."],
["Leaked credentials","Composio holds the Gmail tokens, provider keys stay server-side, and only public Supabase values reach the browser."],
["Provider outage or delay (LLM, Composio, Kapso)","In-app chat and in-app Reminders remain as the fallback channels."]
];
let h='';rows.forEach((r,i)=>{h+=`<div class="row" style="top:${176+i*128}px"><div class="c1">${r[0]}</div><div class="c2">${r[1]}</div><div class="c3"><span class="pill">Planned</span></div></div>`});
document.getElementById('w').insertAdjacentHTML('beforeend',h);
</script></div></body></html>
